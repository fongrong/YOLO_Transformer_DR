# APTOS 2019 Diabetic Retinopathy Dataset Configuration
# For use with YOLO-Transformer training

# Dataset paths (modify according to your setup)
path: /path/to/dataset  # Root directory
train: images/train     # Training images relative to path
val: images/val         # Validation images relative to path
test: images/test       # Test images relative to path

# Class definitions for 5-class DR grading
names:
  0: No_DR              # No diabetic retinopathy
  1: Mild               # Mild non-proliferative DR
  2: Moderate           # Moderate non-proliferative DR  
  3: Severe             # Severe non-proliferative DR
  4: Proliferative_DR   # Proliferative DR

# Number of classes
nc: 5

# Dataset statistics (for reference)
# Total images: 3,662
# Class distribution:
#   No DR: 1,805 (49.3%)
#   Mild: 370 (10.1%)
#   Moderate: 999 (27.3%)
#   Severe: 193 (5.3%)
#   Proliferative DR: 295 (8.1%)

# Preprocessing notes:
# - Images resized to 640x640
# - Normalization: ImageNet mean/std
# - Data augmentation: random flip, rotation, color jitter
